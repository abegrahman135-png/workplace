name = "pf-profile-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

# R2 bucket for profile caching (no egress fees!)
# Create: npx wrangler r2 bucket create pf-profile-cache
[[r2_buckets]]
binding = "PROFILE_CACHE"
bucket_name = "pf-profile-cache"

# ── Session secrets (after deploy) ────────────────────────────────────────
# Add your Instagram session cookie(s). More sessions = more throughput.
#
# Minimum (1 session, ~20 req/min):
#   echo "YOUR_SESSIONID" | npx wrangler secret put IG_SESSION_1
#
# Recommended (3 sessions, ~60 req/min):
#   echo "SESSION_1" | npx wrangler secret put IG_SESSION_1
#   echo "SESSION_2" | npx wrangler secret put IG_SESSION_2
#   echo "SESSION_3" | npx wrangler secret put IG_SESSION_3
#
# Get your sessionid from:
#   Browser → instagram.com → DevTools → Application → Cookies → sessionid
