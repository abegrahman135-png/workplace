<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>ProspectFinder</title>
<link rel="stylesheet" href="styles/tokens.css">
<style>
  body { width: 320px; margin: 0; background: var(--bg-0); }
  .p { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .gem { width: 24px; height: 24px; display: grid; place-items: center; background: linear-gradient(135deg,var(--accent),#ec4899); border-radius: 7px; font-size: 13px; }
  .t { font-weight: 700; font-size: 14px; letter-spacing: -.02em; }
  .tgt { background: var(--bg-2); border: 1px solid var(--line-1); border-radius: 11px; padding: 12px; text-align: center; }
  .tgt .u { font-size: 16px; font-weight: 650; margin-bottom: 2px; }
  .tgt .s { font-size: 11.5px; color: var(--fg-2); }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
  .st { background: var(--bg-2); border: 1px solid var(--line-1); border-radius: 9px; padding: 8px; text-align: center; }
  .st b { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .st span { font-size: 10px; color: var(--fg-2); }
  .bar { height: 5px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg,var(--accent),var(--accent-2)); width: 0%; transition: width .4s var(--ease); }
  button { width: 100%; padding: 9px; font-size: 13px; font-weight: 600; font-family: inherit; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg-0); cursor: pointer; transition: all .12s var(--ease); }
  button:hover { background: var(--bg-4); }
  button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.pri:hover { background: var(--accent-2); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 7px; }
  .note { font-size: 11px; color: var(--fg-2); text-align: center; line-height: 1.45; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="p">
  <div class="top"><span class="gem">✦</span><span class="t">ProspectFinder</span></div>

  <div class="tgt">
    <div class="u" id="target">—</div>
    <div class="s" id="sub">Open an Instagram profile</div>
  </div>

  <div class="stats">
    <div class="st"><b id="k-total">0</b><span>FOUND</span></div>
    <div class="st"><b id="k-high" style="color:var(--hot)">0</b><span>HIGH</span></div>
    <div class="st"><b id="k-queue" style="color:var(--info)">0</b><span>QUEUED</span></div>
  </div>

  <div class="bar"><i id="bar"></i></div>
  <div class="note" id="pipe">Idle</div>

  <button class="pri" id="btn-start">▶ Scan followers</button>
  <div class="row hide" id="running">
    <button id="btn-pause">⏸ Pause</button>
    <button id="btn-stop">⏹ Stop</button>
  </div>
  <button id="btn-dash">📊 Open dashboard</button>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
